version: "3.9"

services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chat_system
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-server:
    build: ./api-server
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://chat_user:chat_password@postgres:5432/chat_system
      REDIS_URL: redis://redis:6379
      SECRET_KEY: change-me-in-production-use-openssl-rand-hex-32
    volumes:
      - ./api-server:/app

  chat-server:
    build: ./chat-server
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://chat_user:chat_password@postgres:5432/chat_system
      SERVICE_NAME: chat-server-1
    volumes:
      - ./chat-server:/app

  presence-server:
    build: ./presence-server
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./presence-server:/app

  notification-server:
    build: ./notification-server
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./notification-server:/app

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api-server
      - chat-server

volumes:
  postgres_data:
